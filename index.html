<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preguntados - Parcial de Computación Gráfica</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --primary-color: #3498db;
            --secondary-color: #2c3e50;
            --correct-color: #2ecc71;
            --incorrect-color: #e74c3c;
            --neutral-bg: #ecf0f1;
            --white: #ffffff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--secondary-color);
            color: var(--secondary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .quiz-container {
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            text-align: center;
        }

        .header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5em;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-top: 10px;
        }

        .main-content {
            padding: 30px;
        }

        #question-text {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 25px;
            min-height: 50px;
        }

        .answer-options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .btn {
            background-color: var(--neutral-bg);
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 15px;
            font-size: 1em;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }
        
        .btn:hover:not([disabled]) {
            background-color: #dbe4e8;
            border-color: var(--primary-color);
        }
        
        .btn:disabled {
            cursor: not-allowed;
        }

        .btn.correct {
            background-color: var(--correct-color);
            color: var(--white);
            font-weight: bold;
        }

        .btn.incorrect {
            background-color: var(--incorrect-color);
            color: var(--white);
            font-weight: bold;
        }

        #next-btn {
            display: none; /* Oculto por defecto */
            width: 50%;
            margin: 30px auto 0;
            padding: 15px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #next-btn:hover {
            background-color: #2980b9;
        }
        
        #results-container {
            padding: 40px;
        }
        
        #results-container h2 {
            margin-top: 0;
        }

        #play-again-btn {
             width: 50%;
            margin: 30px auto 0;
            padding: 15px;
            background-color: var(--correct-color);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }


    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="header">
            <h1>Desafío de Computación Gráfica 🏆</h1>
            <div class="stats">
                <span id="question-counter"></span>
                <span id="score">Puntaje: 0</span>
            </div>
        </div>
        
        <div class="main-content" id="quiz-area">
            <p id="question-text">Aquí va la pregunta...</p>
            <div class="answer-options" id="answer-buttons">
                </div>
            <button id="next-btn">Siguiente Pregunta →</button>
        </div>

        <div class="main-content" id="results-container" style="display: none;">
            <h2>¡Juego Terminado!</h2>
            <p id="results-text">Obtuviste X de Y respuestas correctas.</p>
            <button id="play-again-btn">Volver a Jugar</button>
        </div>
    </div>

    <script>

              answers: [

              answers: [

              ]
            },
            {
              question: "¿Qué significa una reflectividad de 0.0?",
              answers: [
                { text: "Es un espejo perfecto: no se ve su color, solo lo que refleja.", correct: false },
                { text: "Es transparente: los rayos la atraviesan sin desviarse en ningún sentido.", correct: false },
                { text: "Absorbe toda la luz que recibe y se ve completamente negra.", correct: false },
                { text: "Es completamente mate: no genera rayos reflejados y vemos su color", correct: true }

        ];

        const questionTextElement = document.getElementById('question-text');
        const answerButtonsElement = document.getElementById('answer-buttons');
        const nextButton = document.getElementById('next-btn');
        const questionCounterElement = document.getElementById('question-counter');
        const scoreElement = document.getElementById('score');

        const quizArea = document.getElementById('quiz-area');
        const resultsContainer = document.getElementById('results-container');
        const resultsText = document.getElementById('results-text');
        const playAgainBtn = document.getElementById('play-again-btn');

        let shuffledQuestions, currentQuestionIndex;
        let score = 0;

        function startQuiz() {
            score = 0;
            shuffledQuestions = questions.sort(() => Math.random() - .5);
            currentQuestionIndex = 0;
            quizArea.style.display = 'block';
            resultsContainer.style.display = 'none';
            nextButton.style.display = 'none';
            nextButton.innerHTML = "Siguiente Pregunta →";
            showQuestion();
        }

        function showQuestion() {
            resetState();
            let currentQuestion = shuffledQuestions[currentQuestionIndex];
            let questionNo = currentQuestionIndex + 1;
            questionTextElement.innerText = currentQuestion.question;
            questionCounterElement.innerText = `Pregunta ${questionNo} de ${shuffledQuestions.length}`;
            scoreElement.innerText = `Puntaje: ${score}`;

            currentQuestion.answers.forEach(answer => {
                const button = document.createElement('button');
                button.innerText = answer.text;
                button.classList.add('btn');
                answerButtonsElement.appendChild(button);
                if (answer.correct) {
                    button.dataset.correct = answer.correct;
                }
                button.addEventListener('click', selectAnswer);
            });
        }

        function resetState() {
            nextButton.style.display = 'none';
            while (answerButtonsElement.firstChild) {
                answerButtonsElement.removeChild(answerButtonsElement.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === "true";

            if (isCorrect) {
                selectedBtn.classList.add('correct');
                score++;
                scoreElement.innerText = `Puntaje: ${score}`;
            } else {
                selectedBtn.classList.add('incorrect');
            }

            Array.from(answerButtonsElement.children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.classList.add('correct');
                }
                button.disabled = true;
            });

            if (shuffledQuestions.length > currentQuestionIndex + 1) {
                 nextButton.style.display = 'block';
            } else {
                nextButton.innerHTML = "Ver Resultados";
                nextButton.style.display = 'block';
            }
        }

        function handleNextButton() {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledQuestions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults(){
             quizArea.style.display = 'none';
             resultsContainer.style.display = 'block';
             let finalMessage = `¡Juego Terminado! Obtuviste ${score} de ${shuffledQuestions.length} respuestas correctas.`;
             if(score / shuffledQuestions.length > 0.7) {
                 finalMessage += " ¡Excelente trabajo! 🚀"
             } else {
                 finalMessage += " ¡Sigue practicando! 💪"
             }
             resultsText.innerText = finalMessage;
        }


        nextButton.addEventListener('click', () => {
            if(currentQuestionIndex < shuffledQuestions.length){
                handleNextButton();
            }
        });
        
        playAgainBtn.addEventListener('click', startQuiz);

        startQuiz();
    </script>
